<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Thundercomm Rubik Pi 3 connector layout (schematic, not to scale)</title>
  <rect width="900" height="640" fill="#ffffff"/>
  <style>
    .board { fill: #1f2a33; stroke: #0d1317; stroke-width: 2; }
    .part { fill: #c9d1d9; stroke: #57606a; stroke-width: 1.5; }
    .chip { fill: #8c959f; stroke: #57606a; stroke-width: 1.5; }
    .under { fill: none; stroke: #f0b429; stroke-width: 2; stroke-dasharray: 8 5; }
    .lbl { fill: #1f2328; }
    .in { fill: #ffffff; font-size: 12px; }
    .num { fill: #cf222e; stroke: #ffffff; stroke-width: 1.5; }
    .numt { fill: #ffffff; font-weight: bold; font-size: 13px; text-anchor: middle; }
    .lead { stroke: #57606a; stroke-width: 1; }
    .note { fill: #57606a; font-size: 12px; }
  </style>

  <!-- ~100 x 75 mm board -->
  <rect class="board" x="150" y="110" width="600" height="410" rx="22"/>

  <!-- 40-pin header along the top edge -->
  <rect class="part" x="250" y="122" width="400" height="34" rx="3"/>
  <text class="lbl" x="450" y="100" text-anchor="middle">40-pin header (3.3 V)</text>
  <!-- fan -->
  <rect class="part" x="670" y="124" width="40" height="22"/>
  <text class="lbl" x="690" y="100" text-anchor="middle">4-pin PWM fan</text>

  <!-- left edge: debug micro-USB + RTC battery -->
  <rect class="part" x="136" y="200" width="34" height="44" rx="3"/>
  <text class="lbl" x="128" y="216" text-anchor="end">Micro-USB</text>
  <text class="lbl" x="128" y="232" text-anchor="end">debug UART</text>
  <rect class="part" x="160" y="300" width="22" height="30"/>
  <text class="lbl" x="128" y="312" text-anchor="end">2-pin RTC</text>
  <text class="lbl" x="128" y="328" text-anchor="end">battery</text>

  <!-- SoM, WiFi/BT module -->
  <rect class="chip" x="300" y="200" width="230" height="170" rx="6"/>
  <text class="in" x="415" y="280" text-anchor="middle" style="fill:#1f2328">TurboX C6490P SoM</text>
  <text class="in" x="415" y="298" text-anchor="middle" style="fill:#1f2328">QCS6490</text>
  <rect class="chip" x="565" y="200" width="80" height="70" rx="4"/>
  <text class="in" x="605" y="232" text-anchor="middle" style="fill:#1f2328">AP6256</text>
  <text class="in" x="605" y="248" text-anchor="middle" style="fill:#1f2328">WiFi/BT</text>

  <!-- M.2 on the underside -->
  <rect class="under" x="230" y="395" width="300" height="60" rx="4"/>
  <text class="in" x="380" y="430" text-anchor="middle" style="fill:#f0b429">M.2 Key M (underside)</text>

  <!-- right edge: cameras + buttons -->
  <rect class="part" x="722" y="190" width="28" height="80"/>
  <rect class="part" x="722" y="290" width="28" height="80"/>
  <text class="lbl" x="762" y="226">MIPI CSI 1</text>
  <text class="lbl" x="762" y="326">MIPI CSI 2</text>
  <rect class="part" x="730" y="400" width="26" height="18" rx="3"/>
  <rect class="part" x="730" y="440" width="26" height="18" rx="3"/>
  <text class="lbl" x="770" y="414">EDL button</text>
  <text class="lbl" x="770" y="454">Power button</text>

  <!-- bottom edge, left to right -->
  <rect class="part" x="170" y="482" width="30" height="50" rx="3"/>
  <rect class="part" x="222" y="496" width="40" height="30" rx="8"/>
  <rect class="part" x="282" y="476" width="50" height="58"/>
  <rect class="part" x="348" y="460" width="60" height="78"/>
  <rect class="part" x="426" y="452" width="80" height="86"/>
  <rect class="part" x="530" y="490" width="68" height="34" rx="4"/>
  <rect class="part" x="626" y="496" width="40" height="30" rx="8"/>

  <g class="lbl" text-anchor="middle" font-size="11">
    <text x="185" y="566">3.5 mm</text><text x="185" y="582">audio</text>
    <text x="242" y="566">USB-C 3.1</text><text x="242" y="582">+ DP</text>
    <text x="307" y="566">USB 2.0</text><text x="307" y="582">Type-A</text>
    <text x="378" y="566">2x USB 3.0</text><text x="378" y="582">Type-A</text>
    <text x="466" y="566">Gigabit</text><text x="466" y="582">Ethernet</text>
    <text x="564" y="566">HDMI 1.4</text>
    <text x="646" y="566">USB-C PD</text><text x="646" y="582">12 V / 3 A</text>
  </g>

  <!-- numbered callouts -->
  <g>
    <circle class="num" cx="153" cy="186" r="12"/><text class="numt" x="153" y="191">1</text>
    <circle class="num" cx="242" cy="608" r="12"/><text class="numt" x="242" y="613">2</text>
    <circle class="num" cx="646" cy="608" r="12"/><text class="numt" x="646" y="613">3</text>
    <circle class="num" cx="716" cy="409" r="12"/><text class="numt" x="716" y="414">4</text>
    <circle class="num" cx="716" cy="449" r="12"/><text class="numt" x="716" y="454">5</text>
    <circle class="num" cx="300" cy="200" r="12"/><text class="numt" x="300" y="205">6</text>
    <circle class="num" cx="230" cy="395" r="12"/><text class="numt" x="230" y="400">7</text>
    <circle class="num" cx="250" cy="139" r="12"/><text class="numt" x="250" y="144">8</text>
  </g>

  <text class="note" x="20" y="28">Thundercomm Rubik Pi 3, top view. Schematic, not to scale; positions are approximate.</text>
  <text class="note" x="20" y="46">1 debug UART (ttyMSM0)  2 EDL / flashing port  3 power  4 EDL button  5 power button</text>
  <text class="note" x="20" y="64">6 SoM (QCS6490; boots from the onboard UFS)  7 M.2 NVMe  8 40-pin header.  RGB LED not shown.</text>
</svg>
