# Firmware boot script for the Thundercomm Rubik Pi 3
#
# This script expects the following GRUB2 modules to be compiled into the
# GRUB EFI binary (bootaa64.efi, prefix /EFI/BOOT on the ESP):
#
# boot linux squash4 fat part_gpt normal loadenv echo true test fdt
#
# Console: EDK2's EFI console already mirrors to the GENI debug UART
# (ttyMSM0), so GRUB's default `console` terminal reaches serial without a
# `serial` module (GRUB has no GENI UART driver anyway -- its serial
# support is ns16550-only, verified to fail to bind on this board). Expected
# to hold on Rubik Pi 3 too (mainline dts: serial0 = &uart5, 115200n8) --
# pending live-board verification.

# Load the environment for the A/B slot selection
# (image validation/fallback not added here yet...)
load_env

# Boot A or B depending on which one is active. The kernel Image (with EFI
# stub) and DTB live inside the active squashfs slot, so kernel+DT update
# atomically with the slot.
#
# The mainline DTB is loaded EXPLICITLY (fdt module's `devicetree`) instead
# of relying on the firmware-provided DT: this board's EDK2 is Thundercomm's
# SPI-NOR build. On the Q6A port (same SoC, Radxa's EDK2/6.18-era firmware
# DT), that firmware DT's CDSP carve-out (cdsp_mem@8e000000) mismatched the
# mainline 7.1 layout (cdsp_mem@87000000) -- device-proven 2026-07-24: CDSP
# booted on the firmware DT but every fastrpc invoke failed. The same
# fixup is applied here on the presumption that Thundercomm's firmware DT
# carries an analogous carve-out, pending device verification on Rubik Pi 3
# itself. Mainline DTB is the layout the 7.1 kernel + linux-firmware CDSP
# stack are validated against (Armbian edge precedent). If the DTB load
# fails, fall back to the firmware DT (boots fine; only DSP offload is
# degraded). Memory/reserved regions from XBL still arrive via the EFI
# memory map either way.
#
# root=PARTUUID values are the GPT partition GUIDs from
# fwup_include/fwup-common.conf -- keep them in sync.
# Quoted test: if grubenv is missing/corrupt, $boot is unset and the
# comparison must still evaluate (to false) -- the implicit slot-A
# fallback below is load-bearing.
#
# `cgroup_no_v1=all cgroup_enable=memory` (both slots -- keep them in sync)
# pins the pure unified cgroup v2 hierarchy: no v1 controller may be mounted,
# and the memory controller is available on v2. erlinit does the actual mount
# of cgroup2 on /sys/fs/cgroup (rootfs_overlay/etc/erlinit.config).
#
# These are belt-and-braces on THIS board, not a requirement: mainline
# enables the v2 memory controller whenever CONFIG_MEMCG=y, and nothing here
# ever mounts a v1 hierarchy under BR2_INIT_NONE. Device-proven 2026-07-27 --
# a board that OTA'd into the container-enabled firmware booted WITHOUT these
# params (see below) and every container gate still passed. They are kept so
# a full flash produces the intended, explicit configuration.
#
# NOTE: fwup writes this file to the ESP only in `task complete` (a full
# flash). `upgrade.a`/`upgrade.b` carry the rootfs slot and `grubenv` alone,
# so an OTA CANNOT change the kernel cmdline -- plan a full reflash for any
# future change here.
# The slots live on the SAME disk as the ESP GRUB was loaded from, but the
# GRUB disk NUMBER varies with which controllers are populated (NVMe-only
# board: hd0; UFS board: hd0 = other controller, hd1 = SPI NOR, hd2 = UFS —
# device-proven 2026-08-02, the hardcoded hd0 here left the UFS board at the
# grub> prompt). Derive it from $root ("hdN,gpt2") instead of hardcoding;
# regexp is in BR2_TARGET_GRUB2_BUILTIN_MODULES_EFI for exactly this line.
set bootdisk=hd0
regexp -s 1:bootdisk '^([^,]+),' "$root"

if [ "$boot" = "1" ]; then
     echo "Booting slot B..."
     if devicetree (${bootdisk},gpt4)/boot/qcs6490-thundercomm-rubikpi3.dtb; then
          echo "Loaded slot B mainline devicetree"
     else
          echo "DTB load failed; using firmware devicetree"
     fi
     linux (${bootdisk},gpt4)/boot/Image root=PARTUUID=829380db-913c-4d38-9c44-710430b8e6b9 rootwait console=ttyMSM0,115200n8 earlycon quiet cgroup_no_v1=all cgroup_enable=memory
else
     echo "Booting slot A..."
     if devicetree (${bootdisk},gpt3)/boot/qcs6490-thundercomm-rubikpi3.dtb; then
          echo "Loaded slot A mainline devicetree"
     else
          echo "DTB load failed; using firmware devicetree"
     fi
     linux (${bootdisk},gpt3)/boot/Image root=PARTUUID=f2c4ebea-3aef-4f6d-b94a-35087f75e3a8 rootwait console=ttyMSM0,115200n8 earlycon quiet cgroup_no_v1=all cgroup_enable=memory
fi

# Boot!!!
boot
