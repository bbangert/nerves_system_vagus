[storage]
driver = "overlay"
# /root, not /data: the latter is a symlink. Vagus clears <graphroot>/tmp.
graphroot = "/root/containers/storage"
runroot = "/run/containers/storage"
# Vagus recreates every container each boot; keeping container state in the
# runroot spares the flash its writes. Vagus also passes --transient-store,
# and the two must agree for any other podman run on the board.
transient_store = true

[storage.options.overlay]
# As upstream's shipped storage.conf.
mountopt = "nodev"
