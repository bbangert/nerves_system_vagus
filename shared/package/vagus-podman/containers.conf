# Profile-neutral, with the frugal profile's values: Vagus overrides per
# board at boot through CONTAINERS_CONF_OVERRIDE, and a board where that
# fails must still pull without running out of memory.

[containers]
# Vagus tails container logs as files.
log_driver = "k8s-file"
# Vagus passes its own cap per container; this bounds any other container.
# Under the transient store the default log path is on the RAM-backed /run.
log_size_max = 2097152

[network]
network_backend = "netavark"
# The only driver netavark 2.x has, and the image ships no iptables.
firewall_driver = "nftables"
# The default, /etc/containers/networks, is on the read-only rootfs.
network_config_dir = "/root/containers/networks"

[engine]
# No systemd on Nerves.
cgroup_manager = "cgroupfs"
# Vagus reads events from this file. It is on tmpfs, so it never writes
# flash, and the size bound keeps it from growing in RAM.
events_logger = "file"
events_logfile_path = "/run/libpod/events/events.log"
events_logfile_max_size = 4194304
runtime = "crun"
# Only the paths the packages install to, so nothing is searched for.
conmon_path = ["/usr/bin/conmon"]
helper_binaries_dir = ["/usr/libexec/podman"]
# One layer at a time: the default runs several and can OOM a 1 GB board.
image_parallel_copies = 1
# <graphroot>/tmp rather than the RAM-backed /var/tmp. podman does not
# create it, so Vagus does before the first pull.
image_copy_tmp_dir = "storage"

[engine.runtimes]
crun = ["/usr/bin/crun"]
