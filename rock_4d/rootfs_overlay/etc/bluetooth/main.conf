# bluetoothd main.conf for the Dragon Q6A's onboard AIC8800D80 BT.
#
# MinAdvertisementInterval/MaxAdvertisementInterval feed the kernel's
# default LE advertising interval (mgmt Set Default System Config at
# bluetoothd startup).
#
# UNITS: these are Bluetooth spec advertising-interval slots of 0.625 ms,
# NOT milliseconds. The 100/150 below is therefore ~62.5-93.75 ms, which
# is what hcidump decodes on the wire ("min 62.500ms, max 93.750ms").
# Do not read them as "100-150 ms" when retuning.
#
# WHY THEY ARE SET AT ALL: the kernel default is 1280 ms, and BlueZ
# additionally rotates its advertising instance every ~2 s (disable ->
# set params -> enable). On the AIC8800 firmware that combination put
# effectively ZERO advertising events on air, while every HCI command
# still returned status 0x00 and LEAdvertisingManager1.ActiveInstances
# still read 1 -- a completely silent failure from the host's point of
# view (found at aic8800 GATE B1, 2026-07-25). At ~62.5-93.75 ms there
# are tens of advertising events per rotation window and the advert is
# received off-board immediately. This is also the interval range the
# raw-HCI probe used when it first proved the radio itself was fine.
[LE]
MinAdvertisementInterval=100
MaxAdvertisementInterval=150
