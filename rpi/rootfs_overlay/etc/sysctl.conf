#
# /etc/sysctl.conf - Configuration file for setting system variables
#
# The variables in this file are loaded automatically at boot by nerves_runtime.
# See sysctl.conf (5) for information on the file's format.
#
# SHARED FILE: edit shared/sysctl.conf, run `make sync`, commit.

# Allow all user groups to send a ping.
net.ipv4.ping_group_range = 0 2147483647

# Cap dirty page-cache in bytes, not the ratio defaults (10/20 % of RAM): on
# a 12 GB board the ratio lets ~2.4 GB of dirty pages pile up and then stalls
# everything on the flush; on the 1 GB Pi it protects the SD card from write
# storms. UFS/NVMe boards flush this in well under a second.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864

# vm.swappiness and vm.page-cluster are deliberately absent: they depend on
# the swap backing (zram vs swapfile), which Vagus.Host.Swap picks at boot and
# sets via /proc/sys/vm after nerves_runtime has applied this file.
