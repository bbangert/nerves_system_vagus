# Firmware metadata and disk layout shared by fwup.conf and fwup-ops.conf
#
# define() values can be overridden by environment variables of the same name;
# define!() values cannot.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define!(NERVES_FW_PLATFORM, "rock_4d")
define!(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "Isaiah")

# /dev/rootdisk* is erlinit's name for whichever disk holds the rootfs (the
# UFS LUN here). The define!() values cannot be overridden from the
# environment: a stray NERVES_FW_APPLICATION_PART0_* variable would point
# nerves_runtime's mkfs check at the wrong partition.
define!(NERVES_FW_DEVPATH, "/dev/rootdisk0")
define!(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/rootdisk0p5") # Linux part number is 1-based
define!(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define!(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# GPT layout on the UFS LUN. U-Boot lives in the onboard 16 MB SPI NOR (see
# uboot/README.md); nothing on the LUN is read by the boot ROM.
#
# The LUN has 4096-byte logical sectors but fwup only knows 512-byte blocks,
# so every offset below is MiB-aligned and tools/mk_ufs_image.py rewrites the
# GPT for 4096-byte LBAs (keeping names, GUIDs and byte ranges, and growing
# data to fill the module). Never run `fwup -d /dev/sdX` on the module:
# gpt_write uses 512-byte geometry.
#
# +--------------------------------+
# | GPT                            |
# +--------------------------------+ <-- block 2048 (1 MiB)
# | p1: env (raw U-Boot env)       |
# +--------------------------------+ <-- block 4096 (2 MiB)
# | unallocated (room for a        |
# | UFS-resident U-Boot at 8 MiB)  |
# +--------------------------------+ <-- block 32768 (16 MiB)
# | p2: bootfs (FAT, 512-byte BPB) |
# |     extlinux/extlinux.conf     |
# |     Image.a, Image.b, dtbs     |
# +--------------------------------+
# | p3: rootfs-a (squashfs)        |
# +--------------------------------+
# | p4: rootfs-b (squashfs)        |
# +--------------------------------+
# | p5: data (f2fs)                |
# +--------------------------------+

# The env is the first 128 KB of p1, where U-Boot's ENV_IS_IN_SCSI reads it.
# rootfs_overlay/etc/fw_env.config addresses it on the whole disk at
# UBOOT_ENV_OFFSET x 512; scripts/check-env-config.sh fails the build if
# these, CONFIG_ENV_SIZE (uboot/ufs.fragment) or the env image size drift.
# It reads the literals, so keep them literal and on one line each.
define!(ENV_PART_OFFSET, 2048)
define!(ENV_PART_COUNT, 2048)  # 1 MiB
define!(UBOOT_ENV_OFFSET, 2048)
define!(UBOOT_ENV_COUNT, 256)  # 128 KB

# 256 MB leaves room for two uncompressed arm64 kernel Images.
define(BOOT_PART_OFFSET, 32768)
define(BOOT_PART_COUNT, 524288)

# Let each rootfs have room to grow up to 512 MiB
define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 1048576)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# 512 MiB minimum. No `expand = true`: fwup's expand is 512-byte GPT math and
# would corrupt a 4Kn disk; tools/mk_ufs_image.py grows it instead.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)
define-eval(APP_PART_LAST_OFFSET, "${APP_PART_OFFSET} + ${APP_PART_COUNT} - 1")

# GPT identifiers. The rootfs GUIDs double as the root= kernel arguments
# (root=PARTUUID=...) in uboot/uboot.env and the extlinux configs, which
# keeps root selection independent of LUN/sdX enumeration order.
# UBOOT_ENV_PART_GUID must equal CONFIG_ENV_SCSI_PART_UUID in
# uboot/ufs.fragment and nerves_env_uuid in uboot/uboot.env (enforced by
# scripts/check-env-config.sh); keep it on one line.
define(DISK_UUID, "45eba813-e7db-44de-8ac1-1200f2726ab0")
define(BOOT_PART_TYPE, "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7")  # Microsoft basic data (FAT)
define(LINUX_PART_TYPE, "0fc63daf-8483-4772-8e79-3d69d8477de4") # Linux filesystem
define!(UBOOT_ENV_PART_GUID, "a8319de8-8a9f-4eba-968c-fde1f93ec6b5")
define(BOOT_PART_GUID, "efa08f3c-d97e-492c-8645-762abed60dbb")
define(ROOTFS_A_PART_GUID, "d690c98b-aa26-4de8-afdd-fb4012101478")
define(ROOTFS_B_PART_GUID, "fccbcc82-6622-48ed-9d88-9f84cb606e6b")
define(APP_PART_GUID, "98a2738b-8271-4c95-ae81-3bf31d5c44e6")

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
