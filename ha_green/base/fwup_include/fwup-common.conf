# Firmware metadata and disk layout shared by fwup.conf and fwup-ops.conf
#
# define() values can be overridden by environment variables of the same name;
# define!() values cannot.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define!(NERVES_FW_PLATFORM, "ha_green")
define!(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "The Nerves Team")

# /dev/rootdisk* is erlinit's name for whichever disk holds the rootfs (the SD
# card or the eMMC). The define!() values cannot be overridden from the
# environment: a stray NERVES_FW_APPLICATION_PART0_* variable would point
# nerves_runtime's mkfs check at the wrong partition.
define!(NERVES_FW_DEVPATH, "/dev/rootdisk0")
define!(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/rootdisk0p5") # Linux part number is 1-based
define!(NERVES_FW_APPLICATION_PART0_FSTYPE, "ext4")
# Must be the mount point exactly as the kernel reports it in /proc/mounts:
# nerves_runtime's Init compares it literally to decide whether to mkfs the
# partition. The rootfs ships a /data -> root symlink and erlinit mounts via
# /data, which the kernel reports as /root. "/data" here would never match
# and Init would mkfs.ext4 the live data partition on every boot.
define!(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Plain GPT, 512-byte sectors, on the SD card and the eMMC alike. The board
# keeps its stock first-stage loader in LBA 64-16383 (and in the SPI NOR);
# nothing here may write that range. Its SPL loads our U-Boot FIT from LBA
# 16384 of the SD card if one is present, else of the eMMC.
#
#   LBA 0-33       protective MBR + primary GPT (gpt_write)
#   LBA 64-16383   stock loader, never written
#   LBA 16384      u-boot.itb, raw, window reserved through LBA 32767 (8 MiB)
#   LBA 32768      p1 state: U-Boot env in the first 128 KiB (1 MiB)
#   LBA 34816      p2 bootfs, FAT (256 MiB): Image.<slot>, dtb per slot
#   LBA 559104     p3 rootfs A (512 MiB)
#   LBA 1607680    p4 rootfs B (512 MiB)
#   LBA 2656256    p5 data, ext4 (512 MiB minimum, expands to fill the disk)
#
# The kernel root is chosen by device name in the boot script, never by GUID,
# so the SD and eMMC GUID sets below can differ without anything noticing.
define!(FIT_OFFSET, 16384)
define!(FIT_COUNT, 16384)  # 8 MiB, up to LBA 32767

# The env is the first 128 KB of p1, read and written by U-Boot's boot script
# at this LBA of the boot disk. rootfs_overlay/etc/fw_env.config addresses it
# on the whole disk at UBOOT_ENV_OFFSET x 512; scripts/check-env-config.sh
# fails the build if these, the boot script or the env image size drift. It
# reads the literals, so keep them literal and on one line each.
define!(ENV_PART_OFFSET, 32768)
define!(ENV_PART_COUNT, 2048)  # 1 MiB
define!(UBOOT_ENV_OFFSET, 32768)
define!(UBOOT_ENV_COUNT, 256)  # 128 KB

# 256 MB leaves room for two uncompressed arm64 kernel Images.
define-eval(BOOT_PART_OFFSET, "${ENV_PART_OFFSET} + ${ENV_PART_COUNT}")
define(BOOT_PART_COUNT, 524288)

# Let each rootfs have room to grow up to 512 MiB
define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_PART_OFFSET} + ${BOOT_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 1048576)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# 512 MiB minimum; gpt_write grows it to the end of a real device.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)
define-eval(APP_PART_LAST_OFFSET, "${APP_PART_OFFSET} + ${APP_PART_COUNT} - 1")

define(BOOT_PART_TYPE, "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7")  # Microsoft basic data (FAT)
define(LINUX_PART_TYPE, "0fc63daf-8483-4772-8e79-3d69d8477de4") # Linux filesystem

# Fixed per medium so an SD image and the eMMC it installs never share a disk
# or partition GUID. The two gpt blocks must differ in nothing else.
define!(SD_DISK_GUID, "618e0b37-ceaa-4458-bdeb-f2574d76bfd2")
define!(SD_ENV_PART_GUID, "c1880333-17d9-49d1-bf8e-031f0bbe466e")
define!(SD_BOOT_PART_GUID, "51ba3cc6-a298-4aa5-b2cc-a65c0de7feaf")
define!(SD_ROOTFS_A_PART_GUID, "2cf064c4-c04f-468c-b5cf-2fbc5784dbd7")
define!(SD_ROOTFS_B_PART_GUID, "d61ec5a8-5248-4906-ab34-6db3a9b07114")
define!(SD_APP_PART_GUID, "b3c31351-342c-4fab-ac9c-b7b882ae7267")
define!(EMMC_DISK_GUID, "fd9b7f20-0d82-4907-9d65-659c33d234c2")
define!(EMMC_ENV_PART_GUID, "8f09be75-a683-4316-8b6d-9288c32c43d2")
define!(EMMC_BOOT_PART_GUID, "9fac4085-0f19-4b6f-9bf3-99c3726324d0")
define!(EMMC_ROOTFS_A_PART_GUID, "dba1fecd-478a-4ca7-b5dd-4b3c676a41a7")
define!(EMMC_ROOTFS_B_PART_GUID, "e471d818-f92c-4ab9-943e-f611984c6d5e")
define!(EMMC_APP_PART_GUID, "9a32a3c7-21f0-48c3-85c9-3ee26ae4cbbc")

gpt gpt-sd {
    guid = ${SD_DISK_GUID}

    partition 0 {
        block-offset = ${ENV_PART_OFFSET}
        block-count = ${ENV_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${SD_ENV_PART_GUID}
        name = "env"
    }
    partition 1 {
        block-offset = ${BOOT_PART_OFFSET}
        block-count = ${BOOT_PART_COUNT}
        type = ${BOOT_PART_TYPE}
        guid = ${SD_BOOT_PART_GUID}
        name = "bootfs"
    }
    partition 2 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${SD_ROOTFS_A_PART_GUID}
        name = "rootfs-a"
    }
    partition 3 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${SD_ROOTFS_B_PART_GUID}
        name = "rootfs-b"
    }
    partition 4 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${SD_APP_PART_GUID}
        name = "data"
        expand = true
    }
}

gpt gpt-emmc {
    guid = ${EMMC_DISK_GUID}

    partition 0 {
        block-offset = ${ENV_PART_OFFSET}
        block-count = ${ENV_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${EMMC_ENV_PART_GUID}
        name = "env"
    }
    partition 1 {
        block-offset = ${BOOT_PART_OFFSET}
        block-count = ${BOOT_PART_COUNT}
        type = ${BOOT_PART_TYPE}
        guid = ${EMMC_BOOT_PART_GUID}
        name = "bootfs"
    }
    partition 2 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${EMMC_ROOTFS_A_PART_GUID}
        name = "rootfs-a"
    }
    partition 3 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${EMMC_ROOTFS_B_PART_GUID}
        name = "rootfs-b"
    }
    partition 4 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = ${LINUX_PART_TYPE}
        guid = ${EMMC_APP_PART_GUID}
        name = "data"
        expand = true
    }
}

meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
