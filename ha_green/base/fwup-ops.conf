# Post-installation firmware operations for the Home Assistant Green (RK3566)
#
# Tasks include:
#
# * `expand-data` - Grow the SD card's data partition to the end of the card
#                   (SD only; the eMMC's table is final at install)
# * `factory-reset` - Clear out the writable filesystem and any other writable
#                   areas so that they can be re-initialized on the next boot.
# * `prevent-revert` - Prevent `revert` from working until the next firmware
# * `revert` - Revert to the previous firmware if it's still available
# * `validate` - Mark this firmware as a good update.
# * `status` - Print out which partition is active (`a` or `b`)
#
# To use:
#
# 1. Run `fwup -c -f fwup-ops.conf -o ops.fw` and copy ops.fw to
#    the device. This is done automatically as part of the Nerves system
#    build process. The file is stored in `/usr/share/fwup/ops.fw`.
# 2. On the device, run `fwup -t <task> -d /dev/rootdisk0 --enable-trim /usr/share/fwup/ops.fw`.
# 3. Reboot after running `revert` or `factory-reset`.
#
# It is critical that this is kept in sync with the main fwup.conf.
#
# The only write below LBA 32768 is expand-data's gpt_write, which fwup turns
# into a rewrite of LBA 0-255 (its 128 KiB cache segment). That would cover
# the stock loader on the eMMC, so expand-data refuses anything but an SD
# card; the eMMC gets its final GPT from green-install-emmc. The other tasks
# write only the env and p5.

require-fwup-version="1.10.0"

include("${NERVES_SDK_IMAGES:-.}/fwup_include/fwup-common.conf")

uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}

# Writing a card from an image leaves the backup GPT at the image tail and
# p5 (/data) at its minimum size. Re-writing the GPT against the real device
# puts the backup GPT at the true end and grows the expand=true data
# partition to fill it; p1-p4 keep their offsets. Only GPT sectors change,
# so it is safe to re-run with /data mounted.
#
#   fwup -t expand-data -d /dev/rootdisk0 /usr/share/fwup/ops.fw
#   reboot
#   resize2fs /dev/rootdisk0p5
#
# SD card only. The root-device check alone would not stop
# `-d /dev/mmcblk0` from an SD-booted system, so the destination must also
# carry medium.sd, which only complete writes; install writes medium.mmc. The
# slot metadata check also rejects a wrong -d target. fwup's
# require-partition-offset is MBR-only, so the on-disk layout itself cannot
# be verified here: a release that moves partitions must first add a layout
# gate (e.g. a layout-version variable), or expand-data on an old-layout disk
# would rewrite it to the new map.
task expand-data.sd.a {
    require-path-on-device("/", "/dev/mmcblk1p3")
    require-fat-file-exists(${BOOT_PART_OFFSET}, "medium.sd")
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        info("Rewriting GPT sized to the actual disk (expands p5/data)")
        gpt_write(gpt-sd)
    }
}
task expand-data.sd.b {
    require-path-on-device("/", "/dev/mmcblk1p4")
    require-fat-file-exists(${BOOT_PART_OFFSET}, "medium.sd")
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        info("Rewriting GPT sized to the actual disk (expands p5/data)")
        gpt_write(gpt-sd)
    }
}
task expand-data.fail {
    on-init {
        error("Not expanding: only the SD card the system is running from is expanded, and only if complete wrote it (medium.sd in its boot partition, slot metadata present). The eMMC's GPT is already final. Nothing was written.")
    }
}

task factory-reset {
    on-init {
        info("Erasing all writable data")
        # This requires --enable-trim
        trim(${APP_PART_OFFSET}, ${APP_PART_COUNT})
        raw_memset(${APP_PART_OFFSET}, 256, 0xff)
    }
}

# Pass `--enable-trim` to also clear out the partition that no longer should be used.
task prevent-revert.a {
    # Only from a validated B that is really the running rootfs; deleting
    # A's kernel while B is unvalidated would leave nothing to fall back to.
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")
    require-path-on-device("/", "/dev/rootdisk0p4")

    on-init {
        info("Preventing reverts to partition A")
        # Remove U-Boot variables that fwup uses to allow reverting images
        uboot_unsetenv(uboot-env, "a.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "a.nerves_fw_architecture")

        # TRIM requires --enable-trim.
        trim(${ROOTFS_A_PART_OFFSET}, ${ROOTFS_A_PART_COUNT})
        fat_rm(${BOOT_PART_OFFSET}, "Image.a")
        fat_rm(${BOOT_PART_OFFSET}, "rk3566-ha-green.a.dtb")
    }
}
task prevent-revert.b {
    # Only from a validated A that is really the running rootfs; deleting
    # B's kernel while A is unvalidated would leave nothing to fall back to.
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    require-uboot-variable(uboot-env, "nerves_fw_validated", "1")
    require-path-on-device("/", "/dev/rootdisk0p3")

    on-init {
        info("Preventing reverts to partition B")
        # Remove U-Boot variables that fwup uses to allow reverting images
        uboot_unsetenv(uboot-env, "b.nerves_fw_platform")
        uboot_unsetenv(uboot-env, "b.nerves_fw_architecture")

        # TRIM requires --enable-trim.
        trim(${ROOTFS_B_PART_OFFSET}, ${ROOTFS_B_PART_COUNT})
        fat_rm(${BOOT_PART_OFFSET}, "Image.b")
        fat_rm(${BOOT_PART_OFFSET}, "rk3566-ha-green.b.dtb")
    }
}
task prevent-revert.fail {
    on-init {
        error("Running slot is unvalidated or not the one the env names; not preventing revert")
    }
}

task revert.a {
    # This task reverts to the A partition, so check that we're running on B
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")

    # Verify that partition A has the expected platform/architecture
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Reverting to partition A")

        # Switch over
        uboot_setenv(uboot-env, "nerves_fw_active", "a")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
    }
}

task revert.b {
    # This task reverts to the B partition, so check that we're running on A
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")

    # Verify that partition B has the expected platform/architecture
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")

    on-init {
        info("Reverting to partition B")

        # Switch over
        uboot_setenv(uboot-env, "nerves_fw_active", "b")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
    }
}

task revert.unexpected.a {
    require-uboot-variable(uboot-env, "a.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "a.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        # Case where A is good, and the desire is to go to B.
        error("It doesn't look like there's anything to revert to in partition B.")
    }
}
task revert.unexpected.b {
    require-uboot-variable(uboot-env, "b.nerves_fw_platform", "${NERVES_FW_PLATFORM}")
    require-uboot-variable(uboot-env, "b.nerves_fw_architecture", "${NERVES_FW_ARCHITECTURE}")
    on-init {
        # Case where B is good, and the desire is to go to A.
        error("It doesn't look like there's anything to revert to in partition A.")
    }
}

task revert.wrongplatform {
    on-init {
        error("Expecting platform=${NERVES_FW_PLATFORM} and architecture=${NERVES_FW_ARCHITECTURE}")
    }
}

# Run "fwup /usr/share/fwup/ops.fw -t status -d /dev/rootdisk0 -q -U" to check the status.
task status.aa {
    require-path-on-device("/", "/dev/rootdisk0p3")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init { info("a") }
}
task status.ab {
    require-path-on-device("/", "/dev/rootdisk0p3")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init { info("a->b") }
}
task status.bb {
    require-path-on-device("/", "/dev/rootdisk0p4")
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    on-init { info("b") }
}
task status.ba {
    require-path-on-device("/", "/dev/rootdisk0p4")
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    on-init { info("b->a") }
}
task status.fail {
    on-init { error("fail") }
}

# fwup runs the first task whose name starts with `validate` and whose
# requirements pass, so validate.a/validate.b pick the running slot.
task validate.a {
    require-uboot-variable(uboot-env, "nerves_fw_active", "a")
    # After a revert or a torn env the env can name a slot that is not the
    # one running; validating then would bless the slot that failed to boot.
    require-path-on-device("/", "/dev/rootdisk0p3")
    on-init {
        info("Validate")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
        uboot_unsetenv(uboot-env, "upgrade_available")
        uboot_unsetenv(uboot-env, "bootcount")
    }
}

task validate.b {
    require-uboot-variable(uboot-env, "nerves_fw_active", "b")
    require-path-on-device("/", "/dev/rootdisk0p4")
    on-init {
        info("Validate")
        uboot_setenv(uboot-env, "nerves_fw_validated", "1")
        uboot_unsetenv(uboot-env, "upgrade_available")
        uboot_unsetenv(uboot-env, "bootcount")
    }
}

task validate.unexpected {
    on-init { error("nerves_fw_active does not name the running rootfs; not validating") }
}
