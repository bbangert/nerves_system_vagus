#
# Firmware metadata + disk layout shared by fwup.conf and fwup-ops.conf.
#

# All of these can be overridden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "dragon_q6a")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "The Nerves Team")

# /dev/rootdisk* paths are provided by erlinit to refer to the disk and
# partitions on whatever drive provides the rootfs (NVMe here).
define(NERVES_FW_DEVPATH, "/dev/rootdisk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/rootdisk0p5") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "ext4")
# This MUST be the canonical mount point exactly as the kernel reports it in
# /proc/mounts. nerves_runtime's Init compares this string literally against
# /proc/mounts to decide whether to run mkfs on the partition; the rootfs
# ships a /data -> root symlink and erlinit mounts via /data, which the
# kernel resolves and reports as /root. Setting "/data" here makes the check
# miss forever and Init then attempts mkfs.ext4 against the live data
# partition on every boot.
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# This configuration creates a GPT image with the following layout
# (512-byte blocks; EDK2 UEFI on SPI NOR boots \EFI\BOOT\BOOTAA64.EFI from
# the ESP, GRUB reads grubenv and boots the active squashfs slot):
#
# +--------------------------------+
# | GPT                            |
# +--------------------------------+
# | Firmware configuration data    |
# | (uboot env format, block 2048) |
# +--------------------------------+  <- block 32768 (16 MiB), matching the
# | p1: config (FAT, 16 MiB)       |     official RadxaOS first-partition
# +--------------------------------+     offset
# | p2: ESP (FAT, 64 MiB)          |
# | EFI/BOOT/BOOTAA64.EFI          |
# | EFI/BOOT/grub.cfg              |
# | EFI/BOOT/grubenv               |
# +--------------------------------+
# | p3: Rootfs A (squashfs,        |
# |     /boot/Image + DTB inside)  |
# +--------------------------------+
# | p4: Rootfs B (squashfs)        |
# +--------------------------------+
# | p5: Application /data (ext4)   |
# +--------------------------------+
#
# p1 mirrors RadxaOS's small leading FAT "config" partition (plain Linux-fs
# GPT type there too). The live-board probe showed it is OS-consumed (rsetup
# config), not firmware-magic, but keeping it is cheap insurance for the
# untested >3-partition case and a useful provisioning store.

define(UBOOT_ENV_OFFSET, 2048)
define(UBOOT_ENV_COUNT, 16)  # 8 KB

define(CONFIG_PART_OFFSET, 32768)
define(CONFIG_PART_COUNT, 32768)  # 16 MiB

define-eval(ESP_PART_OFFSET, "${CONFIG_PART_OFFSET} + ${CONFIG_PART_COUNT}")
define(ESP_PART_COUNT, 131072)  # 64 MiB (GRUB + cfg + env only)

# Rootfs slots hold the squashfs (kernel + DTB + firmware blobs + DSP shell
# libraries inside), so give them room to grow: 512 MiB each.
define-eval(ROOTFS_A_PART_OFFSET, "${ESP_PART_OFFSET} + ${ESP_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 1048576)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application data partition (512 MiB minimum, expands to fill the disk).
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)
define-eval(APP_PART_LAST_OFFSET, "${APP_PART_OFFSET} + ${APP_PART_COUNT} - 1")

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

# GPT with stable partition GUIDs. The rootfs GUIDs are what grub.cfg's
# root=PARTUUID= kernel arguments reference -- keep all three files in sync.
# No mbr/bootstrap-code stanza: UEFI boots the ESP directly.
gpt gpt {
    guid = c89312fe-c7f8-4c45-a6e2-8856978747d7

    partition 0 {
        block-offset = ${CONFIG_PART_OFFSET}
        block-count = ${CONFIG_PART_COUNT}
        type = 0fc63daf-8483-4772-8e79-3d69d8477de4 # Linux filesystem (matches RadxaOS p1)
        guid = 24f60d80-96a1-41af-922e-0a41acdfdefd
        name = "config"
    }
    partition 1 {
        block-offset = ${ESP_PART_OFFSET}
        block-count = ${ESP_PART_COUNT}
        type = c12a7328-f81f-11d2-ba4b-00a0c93ec93b # EFI system partition
        guid = 727e0166-7c76-4db2-a7a9-907f8323cb28
        name = "efi"
    }
    partition 2 {
        block-offset = ${ROOTFS_A_PART_OFFSET}
        block-count = ${ROOTFS_A_PART_COUNT}
        type = 0fc63daf-8483-4772-8e79-3d69d8477de4 # Linux filesystem
        guid = 4c28c045-1f04-4fd1-9cc5-7355bc336cfc
        name = "rootfs-a"
    }
    partition 3 {
        block-offset = ${ROOTFS_B_PART_OFFSET}
        block-count = ${ROOTFS_B_PART_COUNT}
        type = 0fc63daf-8483-4772-8e79-3d69d8477de4 # Linux filesystem
        guid = 220c8f1b-059b-4365-9614-a5ee29a311b5
        name = "rootfs-b"
    }
    partition 4 {
        block-offset = ${APP_PART_OFFSET}
        block-count = ${APP_PART_COUNT}
        type = 0fc63daf-8483-4772-8e79-3d69d8477de4 # Linux filesystem
        guid = 18f7512f-dcc9-4e5f-affa-2806b08fb1b5
        name = "data"
        expand = true
    }
}

# Location where installed firmware information is stored.
# While this is called "u-boot", u-boot isn't involved in this
# setup. It just provides a convenient key/value store format.
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}
