# Firmware boot script for the Radxa Dragon Q6A
#
# This script expects the following GRUB2 modules to be compiled into the
# GRUB EFI binary (bootaa64.efi, prefix /EFI/BOOT on the ESP):
#
# boot linux squash4 fat part_gpt normal loadenv echo true test fdt
#
# Console: EDK2's EFI console already mirrors to the GENI debug UART
# (ttyMSM0), so GRUB's default `console` terminal reaches serial without a
# `serial` module (GRUB has no GENI UART driver anyway -- its serial
# support is ns16550-only, verified to fail to bind on this board).

# Load the environment for the A/B slot selection
# (image validation/fallback not added here yet...)
load_env

# Boot A or B depending on which one is active. The kernel Image (with EFI
# stub) and DTB live inside the active squashfs slot, so kernel+DT update
# atomically with the slot.
#
# The mainline DTB is loaded EXPLICITLY (fdt module's `devicetree`) instead
# of relying on the firmware-provided DT: the EDK2 DT is Radxa's 6.18-era
# tree whose CDSP carve-out (cdsp_mem@8e000000) mismatches the mainline 7.1
# layout (cdsp_mem@87000000) -- device-proven 2026-07-24: CDSP boots on the
# firmware DT but every fastrpc invoke fails; mainline DTB is the layout the
# 7.1 kernel + linux-firmware CDSP stack are validated against (Armbian
# edge precedent). If the DTB load fails, fall back to the firmware DT
# (boots fine; only DSP offload is degraded). Memory/reserved regions from
# XBL still arrive via the EFI memory map either way.
#
# root=PARTUUID values are the GPT partition GUIDs from
# fwup_include/fwup-common.conf -- keep them in sync.
# Quoted test: if grubenv is missing/corrupt, $boot is unset and the
# comparison must still evaluate (to false) -- the implicit slot-A
# fallback below is load-bearing.
if [ "$boot" = "1" ]; then
     echo "Booting slot B..."
     if devicetree (hd0,gpt4)/boot/qcs6490-radxa-dragon-q6a.dtb; then
          echo "Loaded slot B mainline devicetree"
     else
          echo "DTB load failed; using firmware devicetree"
     fi
     linux (hd0,gpt4)/boot/Image root=PARTUUID=220c8f1b-059b-4365-9614-a5ee29a311b5 rootwait console=ttyMSM0,115200n8 earlycon quiet
else
     echo "Booting slot A..."
     if devicetree (hd0,gpt3)/boot/qcs6490-radxa-dragon-q6a.dtb; then
          echo "Loaded slot A mainline devicetree"
     else
          echo "DTB load failed; using firmware devicetree"
     fi
     linux (hd0,gpt3)/boot/Image root=PARTUUID=4c28c045-1f04-4fd1-9cc5-7355bc336cfc rootwait console=ttyMSM0,115200n8 earlycon quiet
fi

# Boot!!!
boot
