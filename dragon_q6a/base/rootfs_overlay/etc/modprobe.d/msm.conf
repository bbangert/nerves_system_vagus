# The board DTS leaves the display subsystem (mdss) disabled. Without a KMS
# master, msm parks the Adreno GPU as a component that never binds, so there
# is no /dev/dri at all. separate_gpu_kms gives the GPU its own DRM device
# (render node only); it is read-only after load, hence modprobe.d not sysfs.
options msm separate_gpu_kms=1
