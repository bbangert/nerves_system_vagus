# bluetoothd main.conf for the Dragon Q6A's onboard AIC8800D80 BT.
#
# MinAdvertisementInterval/MaxAdvertisementInterval feed the kernel's
# default LE advertising interval (mgmt Set Default System Config at
# bluetoothd startup). The kernel default is 1280 ms, and the legacy
# advertising path additionally rotates every ~2 s (disable -> params
# -> enable churn) -- on the AIC8800 firmware that combination put
# effectively ZERO advertising events on air (BlueZ reported an active
# instance, nothing received over the air; found at aic8800 GATE B1,
# 2026-07-25). 100-150 ms gives ~15+ events per rotation window and
# matches typical peripheral practice (and what the raw-HCI probe
# used when it verified the firmware's legacy advertising works).
[LE]
MinAdvertisementInterval=100
MaxAdvertisementInterval=150
