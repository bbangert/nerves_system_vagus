#
# /etc/sysctl.conf - Configuration file for setting system variables
#
# The variables in this file are loaded automatically at boot by nerves_runtime.
# See sysctl.conf (5) for information on the file's format.
#

# Allow all user groups to send a ping.
net.ipv4.ping_group_range = 0 2147483647

# vagus: kept at the fork's default of 10, but note this is INERT on this
# board today -- the Q6A image configures no swap device at all
# (device-checked: SwapTotal 0, ~11.2 GiB usable on the 16 GB variant), and
# swappiness only governs how eagerly anonymous pages are evicted *to swap*.
# It is left in place so the intent is already correct if zram or a /data
# swapfile is ever added, and so both boards read the same. The rationale
# this file inherited verbatim from rpi3_64 ("a RAM-tight 1GB Pi 3B+ ... with
# a swapfile") does not describe this hardware.
vm.swappiness = 10
