#
# /etc/sysctl.conf - Configuration file for setting system variables
#
# The variables in this file are loaded automatically at boot by nerves_runtime.
# See sysctl.conf (5) for information on the file's format.
#

# Allow all user groups to send a ping.
net.ipv4.ping_group_range = 0 2147483647

# vagus: this is a RAM-tight 1GB Pi 3B+ running HA Core + add-ons with a
# swapfile. The default swappiness of 60 evicts anonymous pages to swap far
# too eagerly, hurting Core's latency; 10 keeps the working set resident and
# only reaches for swap under genuine memory pressure.
vm.swappiness = 10
